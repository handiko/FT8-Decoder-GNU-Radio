<text x="30.0" y="476.0" font-size="10.5" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">Counted: messages that also appear in WSJT-X's own list for that slot. On top of its 316, the flowgraph decoded 16 messages that are not in WSJT-X's</text>
<text x="30.0" y="492.0" font-size="10.5" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">list. I checked them: real callsigns with matching QSO partners, two of them also decoded by ft8_lib; none looks false. 30 slots of pure noise gave 0 decodes.</text>
<text x="30.0" y="516.0" font-size="10.5" fill="#6b6b66" font-weight="400" text-anchor="start" dominant-baseline="central">dB column: within about ±3 dB of WSJT-X (mean offset 0). DT: same as WSJT-X to 0.1 s. Time: about 1.8 s per slot with 3 passes, 0.6 s with 1.</text>
<text x="30.0" y="532.0" font-size="10.5" fill="#6b6b66" font-weight="400" text-anchor="start" dominant-baseline="central">The recordings are the test set that ships with ft8_lib (K. Goba): nine slots saved by WSJT-X in November 2019, thirteen recorded from WebSDR receivers.</text>
