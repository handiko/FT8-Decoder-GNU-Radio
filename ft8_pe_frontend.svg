<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 560" width="1160" height="560" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" role="img" aria-label="Front end and displays">
<title>Front end and displays</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3d3d3a"/></marker><marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A32D2D"/></marker><marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F6E56"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6b66"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6D28D9"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="30.0" y="24.0" font-size="15" fill="#2b2b29" font-weight="700" text-anchor="start" dominant-baseline="central">The front end: three stock blocks, two displays</text>
<rect x="30.0" y="60.0" width="180.0" height="90.0" rx="8" fill="#E6ECFB" stroke="#1d4ed8" stroke-width="1.3"/>
<text x="120.0" y="81.0" font-size="13" fill="#1d4ed8" font-weight="700" text-anchor="middle" dominant-baseline="central">Sound card</text>
<text x="120.0" y="98.0" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">radio audio in</text>
<text x="120.0" y="113.0" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">48,000 samples/s</text>
<text x="120.0" y="128.0" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">level well below clipping</text>
<rect x="250.0" y="60.0" width="220.0" height="90.0" rx="8" fill="#E3F2EC" stroke="#0F6E56" stroke-width="1.3"/>
<text x="360.0" y="81.0" font-size="13" fill="#0F6E56" font-weight="700" text-anchor="middle" dominant-baseline="central">Low Pass Filter</text>
<text x="360.0" y="98.0" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">pass up to 4.5 kHz</text>
<text x="360.0" y="113.0" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">gone by 5 kHz</text>
<text x="360.0" y="128.0" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">keep 1 sample in 4</text>
<rect x="510.0" y="60.0" width="210.0" height="90.0" rx="8" fill="#F8E6E4" stroke="#A32D2D" stroke-width="1.3"/>
<text x="615.0" y="81.0" font-size="13" fill="#A32D2D" font-weight="700" text-anchor="middle" dominant-baseline="central">FT8 decoder stages</text>
<text x="615.0" y="98.0" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">12,000 samples/s</text>
<text x="615.0" y="113.0" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">= 1920 per symbol</text>
<text x="615.0" y="128.0" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">180,000 per slot</text>
<path d="M210.0 105.0 L248.0 105.0" fill="none" stroke="#3d3d3a" stroke-width="1.4" marker-end="url(#ah)"/>
<path d="M470.0 105.0 L508.0 105.0" fill="none" stroke="#3d3d3a" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="250.0" y="200.0" width="220.0" height="90.0" rx="8" fill="#E3F2EC" stroke="#0F6E56" stroke-width="1.3"/>
<text x="360.0" y="221.0" font-size="13" fill="#0F6E56" font-weight="700" text-anchor="middle" dominant-baseline="central">Freq Xlating FIR</text>
<text x="360.0" y="238.0" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">slide 2 kHz down to 0 Hz</text>
<text x="360.0" y="253.0" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">keep ±1.9 kHz</text>
<text x="360.0" y="268.0" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">keep 1 sample in 3</text>
<path d="M360.0 150.0 L360.0 198.0" fill="none" stroke="#3d3d3a" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="510.0" y="186.0" width="210.0" height="50.0" rx="8" fill="#F1F1EE" stroke="#6b6b66" stroke-width="1.3"/>
<text x="615.0" y="202.0" font-size="12" fill="#6b6b66" font-weight="700" text-anchor="middle" dominant-baseline="central">Spectrum</text>
<text x="615.0" y="219.0" font-size="10" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">2048-point FFT, 0–4 kHz</text>
<rect x="510.0" y="254.0" width="210.0" height="50.0" rx="8" fill="#F1F1EE" stroke="#6b6b66" stroke-width="1.3"/>
<text x="615.0" y="270.0" font-size="12" fill="#6b6b66" font-weight="700" text-anchor="middle" dominant-baseline="central">Waterfall</text>
<text x="615.0" y="287.0" font-size="10" fill="#2b2b29" font-weight="400" text-anchor="middle" dominant-baseline="central">1024-point FFT, 0–4 kHz</text>
<path d="M470.0 245.0 L490.0 245.0 L490.0 211.0 L508.0 211.0" fill="none" stroke="#6b6b66" stroke-width="1.4" marker-end="url(#ahm)"/>
<path d="M490.0 245.0 L490.0 279.0 L508.0 279.0" fill="none" stroke="#6b6b66" stroke-width="1.4" marker-end="url(#ahm)"/>
<text x="760.0" y="76.0" font-size="12" fill="#2b2b29" font-weight="700" text-anchor="start" dominant-baseline="central">Why 12,000 samples per second?</text>
<text x="760.0" y="96.0" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">FT8 lives below about 3 kHz, so 12 kHz is plenty, and</text>
<text x="760.0" y="112.0" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">one 0.16 s symbol is then exactly 1920 samples. Every</text>
<text x="760.0" y="128.0" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">number inside the decoder becomes a whole number.</text>
<text x="760.0" y="200.0" font-size="12" fill="#2b2b29" font-weight="700" text-anchor="start" dominant-baseline="central">Why the strange display path?</text>
<text x="760.0" y="220.0" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">Plotting the 12 kHz audio directly spreads the plot over</text>
<text x="760.0" y="236.0" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">0–6 kHz, and the top third is empty. Shifting 2 kHz</text>
<text x="760.0" y="252.0" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">to the centre and decimating to 4 kS/s makes the axis</text>
<text x="760.0" y="268.0" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">read exactly 0–4000 Hz, like WSJT-X's wide graph.</text>
<rect x="30.0" y="330.0" width="1100.0" height="200.0" rx="8" fill="#FFFBEA" stroke="#B45309" stroke-width="1.3"/>
<text x="50.0" y="352.0" font-size="13" fill="#B45309" font-weight="700" text-anchor="start" dominant-baseline="central">Why there is no FFT block between the filter and the decoder</text>
<text x="50.0" y="384.0" font-size="11" fill="#2b2b29" font-weight="700" text-anchor="start" dominant-baseline="central">1. It would only help the first step.</text>
<text x="70.0" y="400.0" font-size="10.5" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">The coarse search uses a spectrogram, but every later step (fine sync, tone reading, subtraction) needs the raw audio.</text>
<text x="50.0" y="418.0" font-size="11" fill="#2b2b29" font-weight="700" text-anchor="start" dominant-baseline="central">2. Stock blocks can't make this spectrogram.</text>
<text x="70.0" y="434.0" font-size="10.5" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">It needs 1920-sample frames moving 480 samples at a time (75 % overlap), zero-padded to 3840. Stream to Vector does not overlap.</text>
<text x="50.0" y="452.0" font-size="11" fill="#2b2b29" font-weight="700" text-anchor="start" dominant-baseline="central">3. Its frames would start in the wrong place.</text>
<text x="70.0" y="468.0" font-size="10.5" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">A stock FFT starts its frames when the flowgraph starts; the search needs frames that start at the slot boundary.</text>
<text x="50.0" y="486.0" font-size="11" fill="#2b2b29" font-weight="700" text-anchor="start" dominant-baseline="central">4. Passes 2 and 3 could not use it.</text>
<text x="70.0" y="502.0" font-size="10.5" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">They search the residual audio, which only exists inside the stages. The spectrogram would be computed twice anyway.</text>
</svg>
