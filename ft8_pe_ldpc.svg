<text x="83.0" y="216.0" font-size="13" fill="#6D28D9" font-weight="700" text-anchor="middle" dominant-baseline="central">+</text>
<rect x="161.0" y="204.0" width="28.0" height="24.0" rx="3" fill="#EFE7FB" stroke="#6D28D9" stroke-width="1.3"/>
<text x="175.0" y="216.0" font-size="13" fill="#6D28D9" font-weight="700" text-anchor="middle" dominant-baseline="central">+</text>
