<text x="359.0" y="216.0" font-size="13" fill="#6D28D9" font-weight="700" text-anchor="middle" dominant-baseline="central">+</text>
<rect x="437.0" y="204.0" width="28.0" height="24.0" rx="3" fill="#EFE7FB" stroke="#6D28D9" stroke-width="1.3"/>
<text x="451.0" y="216.0" font-size="13" fill="#6D28D9" font-weight="700" text-anchor="middle" dominant-baseline="central">+</text>
<circle cx="60.0" cy="312.0" r="11.0" fill="#F8E6E4" stroke="#A32D2D" stroke-width="1.3"/>
<circle cx="106.0" cy="312.0" r="11.0" fill="#F8E6E4" stroke="#A32D2D" stroke-width="1.3"/>
