<text x="159.0" y="566.0" font-size="10" fill="#6b6b66" font-weight="400" text-anchor="middle" dominant-baseline="central">2</text>
<rect x="190.0" y="509.5" width="30.0" height="42.5" rx="2" fill="#6D28D9" stroke="none" stroke-width="0"/>
<text x="205.0" y="500.5" font-size="10" fill="#6D28D9" font-weight="700" text-anchor="middle" dominant-baseline="central">10</text>
<text x="205.0" y="566.0" font-size="10" fill="#6b6b66" font-weight="400" text-anchor="middle" dominant-baseline="central">3</text>
<rect x="236.0" y="535.0" width="30.0" height="17.0" rx="2" fill="#6D28D9" stroke="none" stroke-width="0"/>
<text x="251.0" y="526.0" font-size="10" fill="#6D28D9" font-weight="700" text-anchor="middle" dominant-baseline="central">4</text>
<text x="251.0" y="566.0" font-size="10" fill="#6b6b66" font-weight="400" text-anchor="middle" dominant-baseline="central">4</text>
<rect x="282.0" y="539.2" width="30.0" height="12.8" rx="2" fill="#6D28D9" stroke="none" stroke-width="0"/>
