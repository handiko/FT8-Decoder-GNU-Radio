<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" width="1160" height="620" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" role="img" aria-label="LDPC and CRC">
<title>LDPC and CRC</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3d3d3a"/></marker><marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A32D2D"/></marker><marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F6E56"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6b66"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6D28D9"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="30.0" y="24.0" font-size="15" fill="#2b2b29" font-weight="700" text-anchor="start" dominant-baseline="central">Stage 4, LDPC + CRC: 174 soft bits vote until they agree</text>
<text x="30.0" y="58.0" font-size="12" fill="#2b2b29" font-weight="700" text-anchor="start" dominant-baseline="central">A · What the 174 bits are</text>
<rect x="30.0" y="72.0" width="484.8" height="30.0" rx="4" fill="#E3F2EC" stroke="#0F6E56" stroke-width="1.3"/>
<text x="273.4" y="87.0" font-size="11" fill="#0F6E56" font-weight="700" text-anchor="middle" dominant-baseline="central">77 message bits</text>
<rect x="516.8" y="72.0" width="86.5" height="30.0" rx="4" fill="#FDF0DC" stroke="#B45309" stroke-width="1.3"/>
<text x="561.0" y="87.0" font-size="11" fill="#B45309" font-weight="700" text-anchor="middle" dominant-baseline="central">14 CRC</text>
<rect x="605.3" y="72.0" width="522.7" height="30.0" rx="4" fill="#EFE7FB" stroke="#6D28D9" stroke-width="1.3"/>
<text x="867.6" y="87.0" font-size="11" fill="#6D28D9" font-weight="700" text-anchor="middle" dominant-baseline="central">83 parity bits (LDPC)</text>
<text x="30.0" y="120.0" font-size="10.5" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">Each parity bit is the XOR of a fixed handful of the other bits. So the 174 bits must satisfy 83 checks, each of which involves 6 or 7 bits; every bit sits in 3 checks.</text>
<text x="30.0" y="160.0" font-size="12" fill="#2b2b29" font-weight="700" text-anchor="start" dominant-baseline="central">B · Belief propagation, as a conversation</text>
<path d="M60.0 302.0 L83.0 228.0" fill="none" stroke="#c9c9c3" stroke-width="1"/>
<path d="M106.0 302.0 L83.0 228.0" fill="none" stroke="#c9c9c3" stroke-width="1"/>
