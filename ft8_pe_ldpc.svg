<circle cx="474.0" cy="312.0" r="11.0" fill="#F8E6E4" stroke="#A32D2D" stroke-width="1.3"/>
<text x="290.0" y="190.0" font-size="10" fill="#6D28D9" font-weight="700" text-anchor="middle" dominant-baseline="central">checks (XOR must be 0)</text>
<text x="290.0" y="336.0" font-size="10" fill="#A32D2D" font-weight="700" text-anchor="middle" dominant-baseline="central">coded bits (soft values from stage 3)</text>
<text x="560.0" y="196.0" font-size="10.5" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">1. Every bit tells its 3 checks how sure it is that it is a 1 or a 0.</text>
<text x="560.0" y="214.0" font-size="10.5" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">2. Every check answers each of its bits: "from what the others say,</text>
<text x="560.0" y="230.0" font-size="10.5" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">    this is what you must be for me to come out 0".</text>
<text x="560.0" y="248.0" font-size="10.5" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">3. Each bit adds up its own reading and its 3 answers, and tries again.</text>
<text x="560.0" y="266.0" font-size="10.5" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">4. Stop when all 83 checks are satisfied (or after 40 rounds).</text>
<text x="560.0" y="292.0" font-size="10.5" fill="#6b6b66" font-weight="400" text-anchor="start" dominant-baseline="central">All candidates and all 4 soft-bit versions go through together as one</text>
<text x="560.0" y="308.0" font-size="10.5" fill="#6b6b66" font-weight="400" text-anchor="start" dominant-baseline="central">numpy batch: about 0.4 s for a busy slot, all three passes.</text>
<text x="30.0" y="362.0" font-size="12" fill="#2b2b29" font-weight="700" text-anchor="start" dominant-baseline="central">C · The real signal from stage 3 (CQ UY5AX KO70): unsatisfied checks per round</text>
<rect x="90.0" y="382.0" width="460.0" height="170.0" rx="0" fill="#ffffff" stroke="#d9d9d4" stroke-width="1"/>
