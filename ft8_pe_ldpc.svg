<text x="389.0" y="566.0" font-size="10" fill="#6b6b66" font-weight="400" text-anchor="middle" dominant-baseline="central">7</text>
<rect x="420.0" y="552.0" width="30.0" height="1.5" rx="2" fill="#0F6E56" stroke="none" stroke-width="0"/>
<text x="435.0" y="543.0" font-size="10" fill="#0F6E56" font-weight="700" text-anchor="middle" dominant-baseline="central">0</text>
<text x="435.0" y="566.0" font-size="10" fill="#6b6b66" font-weight="400" text-anchor="middle" dominant-baseline="central">8</text>
<rect x="466.0" y="552.0" width="30.0" height="1.5" rx="2" fill="#0F6E56" stroke="none" stroke-width="0"/>
<text x="481.0" y="543.0" font-size="10" fill="#0F6E56" font-weight="700" text-anchor="middle" dominant-baseline="central">0</text>
<text x="481.0" y="566.0" font-size="10" fill="#6b6b66" font-weight="400" text-anchor="middle" dominant-baseline="central">9</text>
<rect x="512.0" y="552.0" width="30.0" height="1.5" rx="2" fill="#0F6E56" stroke="none" stroke-width="0"/>
<text x="527.0" y="543.0" font-size="10" fill="#0F6E56" font-weight="700" text-anchor="middle" dominant-baseline="central">0</text>
<text x="527.0" y="566.0" font-size="10" fill="#6b6b66" font-weight="400" text-anchor="middle" dominant-baseline="central">10</text>
<text x="320.0" y="584.0" font-size="10" fill="#6b6b66" font-weight="600" text-anchor="middle" dominant-baseline="central">round</text>
<text x="274.0" y="412.0" font-size="10.5" fill="#0F6E56" font-weight="700" text-anchor="start" dominant-baseline="central">18 wrong bits going in; all fixed by round 6</text>
<text x="620.0" y="362.0" font-size="12" fill="#2b2b29" font-weight="700" text-anchor="start" dominant-baseline="central">D · A candidate is only accepted if</text>
<circle cx="630.0" cy="392.0" r="4.0" fill="#0F6E56" stroke="none" stroke-width="1"/>
<text x="642.0" y="392.0" font-size="10.5" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">all 83 parity checks are satisfied,</text>
<circle cx="630.0" cy="416.0" r="4.0" fill="#0F6E56" stroke="none" stroke-width="1"/>
<text x="642.0" y="416.0" font-size="10.5" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">the CRC-14 over the 77 message bits matches,</text>
<circle cx="630.0" cy="440.0" r="4.0" fill="#0F6E56" stroke="none" stroke-width="1"/>
<text x="642.0" y="440.0" font-size="10.5" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">the message is not all zeros (whose CRC is also 0),</text>
<circle cx="630.0" cy="464.0" r="4.0" fill="#0F6E56" stroke="none" stroke-width="1"/>
<text x="642.0" y="464.0" font-size="10.5" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">no more than 36 of the 174 bits had to be changed,</text>
<circle cx="630.0" cy="488.0" r="4.0" fill="#0F6E56" stroke="none" stroke-width="1"/>
<text x="642.0" y="488.0" font-size="10.5" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">and then the first of the 4 soft-bit versions that passed is used.</text>
<text x="620.0" y="522.0" font-size="10.5" fill="#6b6b66" font-weight="400" text-anchor="start" dominant-baseline="central">Pure noise almost never satisfies all of this: 30 slots of noise gave 0 decodes.</text>
<text x="620.0" y="538.0" font-size="10.5" fill="#6b6b66" font-weight="400" text-anchor="start" dominant-baseline="central">Of the 54 candidates that reached stage 4 in the slot above, 26 came out as</text>
<text x="620.0" y="554.0" font-size="10.5" fill="#6b6b66" font-weight="400" text-anchor="start" dominant-baseline="central">codewords with the first soft-bit version alone.</text>
</svg>
