<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" width="1160" height="620" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" role="img" aria-label="Slot clock">
<title>Slot clock</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3d3d3a"/></marker><marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A32D2D"/></marker><marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F6E56"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6b66"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6D28D9"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="30.0" y="24.0" font-size="15" fill="#2b2b29" font-weight="700" text-anchor="start" dominant-baseline="central">Stage 1, the Slot Clock: turning a sample stream into 15-second slots</text>
<text x="30.0" y="56.0" font-size="12" fill="#2b2b29" font-weight="700" text-anchor="start" dominant-baseline="central">A · The flowgraph starts 7 s into a slot</text>
<path d="M90.0 90.0 L90.0 162.0" fill="none" stroke="#d9d9d4" stroke-width="1"/>
<text x="90.0" y="82.0" font-size="11" fill="#6b6b66" font-weight="700" text-anchor="middle" dominant-baseline="central">:00</text>
<path d="M322.5 90.0 L322.5 162.0" fill="none" stroke="#d9d9d4" stroke-width="1"/>
<text x="322.5" y="82.0" font-size="11" fill="#6b6b66" font-weight="700" text-anchor="middle" dominant-baseline="central">:15</text>
<path d="M555.0 90.0 L555.0 162.0" fill="none" stroke="#d9d9d4" stroke-width="1"/>
<text x="555.0" y="82.0" font-size="11" fill="#6b6b66" font-weight="700" text-anchor="middle" dominant-baseline="central">:30</text>
<path d="M787.5 90.0 L787.5 162.0" fill="none" stroke="#d9d9d4" stroke-width="1"/>
<text x="787.5" y="82.0" font-size="11" fill="#6b6b66" font-weight="700" text-anchor="middle" dominant-baseline="central">:45</text>
<path d="M1020.0 90.0 L1020.0 162.0" fill="none" stroke="#d9d9d4" stroke-width="1"/>
<text x="1020.0" y="82.0" font-size="11" fill="#6b6b66" font-weight="700" text-anchor="middle" dominant-baseline="central">:00</text>
<rect x="198.5" y="100.0" width="121.0" height="30.0" rx="4" fill="#F1F1EE" stroke="#6b6b66" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="260.5" y="115.0" font-size="10" fill="#6b6b66" font-weight="700" text-anchor="middle" dominant-baseline="central">only 8 s heard: skipped</text>
<path d="M198.5 156.0 L198.5 134.0" fill="none" stroke="#1d4ed8" stroke-width="1.6" marker-end="url(#ahb)"/>
<text x="194.5" y="162.0" font-size="10" fill="#1d4ed8" font-weight="700" text-anchor="end" dominant-baseline="central">Run pressed</text>
<rect x="324.5" y="100.0" width="227.5" height="30.0" rx="4" fill="#E3F2EC" stroke="#0F6E56" stroke-width="1.2"/>
<text x="438.8" y="115.0" font-size="10" fill="#0F6E56" font-weight="700" text-anchor="middle" dominant-baseline="central">slot 1: 180,000 samples</text>
<path d="M545.7 132.0 L545.7 154.0" fill="none" stroke="#A32D2D" stroke-width="1.6" marker-end="url(#ahc)"/>
<text x="549.7" y="160.0" font-size="10" fill="#A32D2D" font-weight="700" text-anchor="start" dominant-baseline="central">sent at 14.4 s</text>
<rect x="557.0" y="100.0" width="227.5" height="30.0" rx="4" fill="#E3F2EC" stroke="#0F6E56" stroke-width="1.2"/>
<text x="671.2" y="115.0" font-size="10" fill="#0F6E56" font-weight="700" text-anchor="middle" dominant-baseline="central">slot 2: 180,000 samples</text>
<path d="M778.2 132.0 L778.2 154.0" fill="none" stroke="#A32D2D" stroke-width="1.6" marker-end="url(#ahc)"/>
<text x="782.2" y="160.0" font-size="10" fill="#A32D2D" font-weight="700" text-anchor="start" dominant-baseline="central">sent at 14.4 s</text>
<rect x="789.5" y="100.0" width="227.5" height="30.0" rx="4" fill="#E3F2EC" stroke="#0F6E56" stroke-width="1.2"/>
<text x="903.8" y="115.0" font-size="10" fill="#0F6E56" font-weight="700" text-anchor="middle" dominant-baseline="central">slot 3: 180,000 samples</text>
<path d="M1010.7 132.0 L1010.7 154.0" fill="none" stroke="#A32D2D" stroke-width="1.6" marker-end="url(#ahc)"/>
<text x="1014.7" y="160.0" font-size="10" fill="#A32D2D" font-weight="700" text-anchor="start" dominant-baseline="central">sent at 14.4 s</text>
<text x="1036.0" y="115.0" font-size="11" fill="#6b6b66" font-weight="400" text-anchor="start" dominant-baseline="central">… every 15 s</text>
<text x="30.0" y="188.0" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">The sound card only gives me a stream of samples, with no time on them. The Slot Clock counts samples and ties the count to the PC clock (which my time-sync</text>
<text x="30.0" y="204.0" font-size="11" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">software keeps on UTC). At 14.4 s into each slot it copies that slot's 180,000 samples out of a 40-second ring buffer and sends them on as one message.</text>
<text x="30.0" y="236.0" font-size="12" fill="#2b2b29" font-weight="700" text-anchor="start" dominant-baseline="central">B · Keeping the count honest: a simulated sound card running 80 ppm fast, audio arriving in uneven chunks</text>
<rect x="110.0" y="270.0" width="760.0" height="280.0" rx="0" fill="#ffffff" stroke="#d9d9d4" stroke-width="1"/>
<path d="M110.0 550.0 L870.0 550.0" fill="none" stroke="#eeeeea" stroke-width="1"/>
<text x="102.0" y="550.0" font-size="10" fill="#6b6b66" font-weight="400" text-anchor="end" dominant-baseline="central">-180</text>
<path d="M110.0 494.0 L870.0 494.0" fill="none" stroke="#eeeeea" stroke-width="1"/>
<text x="102.0" y="494.0" font-size="10" fill="#6b6b66" font-weight="400" text-anchor="end" dominant-baseline="central">-140</text>
<path d="M110.0 438.0 L870.0 438.0" fill="none" stroke="#eeeeea" stroke-width="1"/>
<text x="102.0" y="438.0" font-size="10" fill="#6b6b66" font-weight="400" text-anchor="end" dominant-baseline="central">-100</text>
<path d="M110.0 382.0 L870.0 382.0" fill="none" stroke="#eeeeea" stroke-width="1"/>
<text x="102.0" y="382.0" font-size="10" fill="#6b6b66" font-weight="400" text-anchor="end" dominant-baseline="central">-60</text>
<path d="M110.0 326.0 L870.0 326.0" fill="none" stroke="#eeeeea" stroke-width="1"/>
<text x="102.0" y="326.0" font-size="10" fill="#6b6b66" font-weight="400" text-anchor="end" dominant-baseline="central">-20</text>
<path d="M110.0 270.0 L870.0 270.0" fill="none" stroke="#eeeeea" stroke-width="1"/>
<text x="102.0" y="270.0" font-size="10" fill="#6b6b66" font-weight="400" text-anchor="end" dominant-baseline="central">20</text>
<text x="110.0" y="564.0" font-size="10" fill="#6b6b66" font-weight="400" text-anchor="middle" dominant-baseline="central">0</text>
<text x="236.7" y="564.0" font-size="10" fill="#6b6b66" font-weight="400" text-anchor="middle" dominant-baseline="central">5</text>
<text x="363.3" y="564.0" font-size="10" fill="#6b6b66" font-weight="400" text-anchor="middle" dominant-baseline="central">10</text>
<text x="490.0" y="564.0" font-size="10" fill="#6b6b66" font-weight="400" text-anchor="middle" dominant-baseline="central">15</text>
<text x="616.7" y="564.0" font-size="10" fill="#6b6b66" font-weight="400" text-anchor="middle" dominant-baseline="central">20</text>
<text x="743.3" y="564.0" font-size="10" fill="#6b6b66" font-weight="400" text-anchor="middle" dominant-baseline="central">25</text>
<text x="870.0" y="564.0" font-size="10" fill="#6b6b66" font-weight="400" text-anchor="middle" dominant-baseline="central">30</text>
<text x="490.0" y="582.0" font-size="10" fill="#6b6b66" font-weight="600" text-anchor="middle" dominant-baseline="central">minutes since start</text>
<text x="60.0" y="410.0" font-size="10" fill="#6b6b66" font-weight="600" text-anchor="middle" dominant-baseline="central">ms</text>
<text x="116.0" y="258.0" font-size="10" fill="#6b6b66" font-weight="600" text-anchor="start" dominant-baseline="central">where the decoder thinks each slot starts, minus where it really starts</text>
<polyline points="107.0,329.8 113.4,331.5 119.7,333.2 126.0,334.9 132.4,336.5 138.7,338.2 145.0,339.9 151.4,341.6 157.7,343.3 164.0,344.9 170.4,346.6 176.7,348.3 183.0,350.0 189.4,351.7 195.7,353.3 202.0,355.0 208.4,356.7 214.7,358.4 221.0,360.1 227.4,361.7 233.7,363.4 240.0,365.1 246.4,366.8 252.7,368.5 259.0,370.1 265.4,371.8 271.7,373.5 278.0,375.2 284.4,376.9 290.7,378.5 297.0,380.2 303.4,381.9 309.7,383.6 316.0,385.3 322.4,386.9 328.7,388.6 335.0,390.3 341.4,392.0 347.7,393.7 354.0,395.3 360.4,397.0 366.7,398.7 373.0,400.4 379.4,402.1 385.7,403.7 392.0,405.4 398.4,407.1 404.7,408.8 411.0,410.5 417.4,412.1 423.7,413.8 430.0,415.5 436.4,417.2 442.7,418.9 449.0,420.5 455.4,422.2 461.7,423.9 468.0,425.6 474.4,427.3 480.7,428.9 487.0,430.6 493.4,432.3 499.7,434.0 506.0,435.7 512.4,437.3 518.7,439.0 525.0,440.7 531.4,442.4 537.7,444.1 544.0,445.7 550.4,447.4 556.7,449.1 563.0,450.8 569.4,452.5 575.7,454.1 582.0,455.8 588.4,457.5 594.7,459.2 601.0,460.9 607.4,462.5 613.7,464.2 620.0,465.9 626.4,467.6 632.7,469.3 639.0,470.9 645.4,472.6 651.7,474.3 658.0,476.0 664.4,477.7 670.7,479.3 677.0,481.0 683.4,482.7 689.7,484.4 696.0,486.1 702.4,487.7 708.7,489.4 715.0,491.1 721.4,492.8 727.7,494.5 734.0,496.1 740.4,497.8 746.7,499.5 753.0,501.2 759.4,502.9 765.7,504.5 772.0,506.2 778.4,507.9 784.7,509.6 791.0,511.3 797.4,512.9 803.7,514.6 810.0,516.3 816.4,518.0 822.7,519.7 829.0,521.3 835.4,523.0 841.7,524.7 848.0,526.4 854.4,528.1 860.7,529.7 867.0,531.4" fill="none" stroke="#B91C1C" stroke-width="2" stroke-linejoin="round"/>
<polyline points="107.0,325.1 113.4,324.7 119.7,325.6 126.0,324.7 132.4,324.9 138.7,326.0 145.0,326.1 151.4,325.0 157.7,324.8 164.0,325.1 170.4,325.8 176.7,325.9 183.0,324.5 189.4,324.8 195.7,325.5 202.0,325.1 208.4,324.9 214.7,324.9 221.0,324.9 227.4,325.1 233.7,324.5 240.0,325.6 246.4,325.1 252.7,325.0 259.0,325.2 265.4,324.6 271.7,324.9 278.0,325.1 284.4,324.9 290.7,324.5 297.0,325.2 303.4,325.0 309.7,324.6 316.0,324.8 322.4,325.4 328.7,324.7 335.0,326.5 341.4,325.1 347.7,324.9 354.0,325.3 360.4,325.0 366.7,325.5 373.0,324.6 379.4,325.1 385.7,325.5 392.0,325.2 398.4,325.5 404.7,324.9 411.0,324.6 417.4,325.1 423.7,325.4 430.0,325.8 436.4,325.0 442.7,324.8 449.0,325.0 455.4,325.4 461.7,325.4 468.0,325.3 474.4,325.0 480.7,324.7 487.0,325.5 493.4,324.9 499.7,324.6 506.0,324.9 512.4,325.0 518.7,324.9 525.0,325.1 531.4,324.5 537.7,325.3 544.0,325.7 550.4,325.0 556.7,324.9 563.0,324.8 569.4,325.2 575.7,325.8 582.0,325.1 588.4,325.2 594.7,324.8 601.0,325.3 607.4,325.0 613.7,325.5 620.0,324.8 626.4,324.6 632.7,325.0 639.0,325.0 645.4,324.7 651.7,325.0 658.0,325.4 664.4,324.6 670.7,325.2 677.0,325.6 683.4,325.3 689.7,325.5 696.0,325.2 702.4,325.0 708.7,324.8 715.0,324.8 721.4,324.8 727.7,325.2 734.0,325.1 740.4,325.2 746.7,324.8 753.0,325.0 759.4,325.1 765.7,325.1 772.0,325.5 778.4,325.3 784.7,325.5 791.0,325.6 797.4,325.3 803.7,325.6 810.0,325.2 816.4,325.7 822.7,324.9 829.0,324.7 835.4,325.3 841.7,326.1 848.0,325.2 854.4,324.9 860.7,324.6 867.0,325.3" fill="none" stroke="#0F6E56" stroke-width="2.4" stroke-linejoin="round"/>
<text x="878.0" y="531.4" font-size="11" fill="#B91C1C" font-weight="700" text-anchor="start" dominant-baseline="central">count only:</text>
<text x="878.0" y="546.4" font-size="11" fill="#B91C1C" font-weight="400" text-anchor="start" dominant-baseline="central">-167 ms after 30 min</text>
<text x="878.0" y="317.3" font-size="11" fill="#0F6E56" font-weight="700" text-anchor="start" dominant-baseline="central">re-anchored every slot:</text>
<text x="878.0" y="332.3" font-size="11" fill="#0F6E56" font-weight="400" text-anchor="start" dominant-baseline="central">flat at about −20 ms</text>
<text x="124.0" y="466.0" font-size="10.5" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">Each chunk of audio arrives a little late, by a varying amount.</text>
<text x="124.0" y="481.0" font-size="10.5" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">The smallest lateness seen during a slot is the true delay, so</text>
<text x="124.0" y="496.0" font-size="10.5" fill="#2b2b29" font-weight="400" text-anchor="start" dominant-baseline="central">the clock moves its anchor by that much at every slot.</text>
<text x="124.0" y="518.0" font-size="10.5" fill="#6b6b66" font-weight="400" text-anchor="start" dominant-baseline="central">The −20 ms left over is the fixed audio delay (DT reads +0.02 s);</text>
<text x="124.0" y="533.0" font-size="10.5" fill="#6b6b66" font-weight="400" text-anchor="start" dominant-baseline="central">the clock_offset parameter can take it out if it ever matters.</text>
</svg>
